<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d1a">
<title>FPS Project X — Neon Range</title>
<style>
:root{color-scheme:dark;--cyan:#55f5ff;--pink:#ff4fb8;--bg:#080d1a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;color:#effaff}
canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;text-shadow:0 0 12px #55f5ff88}
.brand{font-weight:900;letter-spacing:.13em;font-size:clamp(12px,2.7vw,18px)}.sub{font-size:10px;color:#9bc9d8;letter-spacing:.15em}
.panel{border:1px solid #55f5ff66;background:#071222b8;border-radius:10px;padding:8px 11px;backdrop-filter:blur(8px);font-size:12px}
#score{font-weight:900;font-size:20px;color:var(--cyan);font-variant-numeric:tabular-nums}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;pointer-events:none}
.center:before,.center:after{content:"";position:absolute;background:#d9ffff;box-shadow:0 0 7px var(--cyan)}
.center:before{width:2px;height:24px;left:12px;top:1px}.center:after{height:2px;width:24px;top:12px;left:1px}
#message{position:absolute;left:50%;top:23%;transform:translateX(-50%);text-align:center;font-weight:800;font-size:clamp(14px,3vw,20px);letter-spacing:.1em;text-shadow:0 0 16px var(--cyan);white-space:nowrap}
.bottom{display:flex;justify-content:space-between;align-items:end;gap:12px}
.controls{display:flex;gap:8px;pointer-events:auto;align-items:end}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,42px);gap:4px}
button{font:inherit;color:#effaff;background:#0b2034dd;border:1px solid #55f5ff88;border-radius:12px;min-width:44px;min-height:42px;font-weight:800;box-shadow:inset 0 0 15px #55f5ff12;touch-action:none}
button:active{background:#15516a;transform:scale(.97)}
.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}
#tag{min-width:76px;min-height:76px;border-radius:50%;border:2px solid var(--pink);background:#401535dd;box-shadow:0 0 22px #ff4fb855;color:#fff;font-size:12px;letter-spacing:.08em}
#start{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#102d46ef,#050812f5);padding:24px;text-align:center;z-index:5}
.card{max-width:460px;border:1px solid #55f5ff77;background:#081321ee;border-radius:20px;padding:26px 22px;box-shadow:0 0 60px #13d9ff20}
h1{margin:0 0 8px;font-size:clamp(25px,6vw,40px);letter-spacing:.08em}h1 span{color:var(--cyan)}.desc{color:#b8d3df;line-height:1.65;font-size:14px;margin:12px 0 20px}
#play{width:100%;padding:13px;border-color:var(--cyan);background:#0b3c50;font-size:15px;letter-spacing:.12em}
.hint{font-size:11px;color:#8caebe;margin-top:12px}
@media(min-width:700px){.pad button{min-width:52px;min-height:48px}.pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px)}}
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Range game canvas"></canvas>
<div id="hud">
 <div class="top"><div><div class="brand">FPS PROJECT <span style="color:var(--cyan)">X</span></div><div class="sub">NEON RANGE // TRAINING SIM</div></div><div class="panel">SCORE <div id="score">0000</div></div></div>
 <div id="message">TAP THE GLOWING DRONES</div><div class="center"></div>
 <div class="bottom"><div class="controls"><div class="pad"><button data-move="forward" aria-label="Move forward">▲</button><button data-move="left" aria-label="Move left">◀</button><button data-move="back" aria-label="Move back">▼</button><button data-move="right" aria-label="Move right">▶</button></div></div><div class="controls"><button id="tag" aria-label="Tag target">TAG<br>✦</button></div></div>
</div>
<div id="start"><div class="card"><div class="sub">PROJECT X / BUILD 0.1</div><h1>NEON <span>RANGE</span></h1><div class="desc">進入科幻訓練場，點擊畫面中發光的無人機目標得分！<br>使用方向鍵移動；拖曳畫面可轉動視角。這是純虛構的街機遊戲原型。</div><button id="play">開始訓練 ▶</button><div class="hint">手機：方向鍵移動・拖曳轉向・點擊目標</div></div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),message=document.getElementById('message'),start=document.getElementById('start');
let w=innerWidth,h=innerHeight,dpr=1,score=0,active=false,yaw=0,pitch=0,px=0,pz=0,last=0,flash=0;
const keys={forward:false,back:false,left:false,right:false};let targets=[];
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function spawn(){targets=[];for(let i=0;i<7;i++)targets.push({x:(Math.random()-.5)*15,z:7+Math.random()*19,y:1.3+Math.random()*2.6,r:.35+Math.random()*.18,phase:Math.random()*6.28,alive:true})}
function project(x,y,z){let dx=x-px,dz=z-pz,c=Math.cos(yaw),s=Math.sin(yaw),rx=dx*c-dz*s,rz=dx*s+dz*c;if(rz<.25)return null;let f=Math.min(w,h)*.9,scale=f/rz;return {x:w/2+rx*scale,y:h*.51-(y-1.7)*scale+pitch*scale,scale,z:rz}}
function draw(){
 ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#081126');sky.addColorStop(.55,'#12304a');sky.addColorStop(1,'#050813');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
 const horizon=h*.52+pitch*.2;
 for(let i=0;i<24;i++){let bw=18+(i*17%45),bh=22+(i*31%95),x=((i*83-yaw*22)%(w+80)+w+80)%(w+80)-40;ctx.fillStyle=i%2?'#102b42':'#0b2038';ctx.fillRect(x,horizon-bh,bw,bh);ctx.fillStyle='#43dff522';for(let yy=horizon-bh+8;yy<horizon-5;yy+=12)ctx.fillRect(x+5,yy,3,4)}
 ctx.fillStyle='#07101f';ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(w,horizon);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();ctx.strokeStyle='#35d9ff35';ctx.lineWidth=1;
 for(let i=-12;i<=12;i++){let a=project(i,0,25),b=project(i,0,.8);if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
 for(let z=2;z<30;z+=z<8?1:3){let a=project(-20,0,z),b=project(20,0,z);if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
 targets.filter(t=>t.alive).sort((a,b)=>b.z-a.z).forEach(t=>{const bob=Math.sin(performance.now()*.002+t.phase)*.16,p=project(t.x+Math.sin(performance.now()*.0008+t.phase)*.25,t.y+bob,t.z);if(!p)return;const r=Math.max(3,t.r*p.scale);if(p.x < -r*2||p.x>w+r*2)return;t.screen={x:p.x,y:p.y,r:Math.max(12,r*1.15)};ctx.save();ctx.translate(p.x,p.y);ctx.shadowBlur=22;ctx.shadowColor='#55f5ff';ctx.strokeStyle='#55f5ff';ctx.lineWidth=Math.max(1,r*.08);ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#52eaff22';ctx.fill();ctx.beginPath();ctx.arc(0,0,r*.56,0,Math.PI*2);ctx.strokeStyle='#ff4fb8';ctx.shadowColor='#ff4fb8';ctx.stroke();ctx.fillStyle='#eaffff';ctx.beginPath();ctx.arc(0,0,Math.max(1,r*.14),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9dfaff88';ctx.beginPath();ctx.moveTo(-r*1.5,0);ctx.lineTo(-r*.9,0);ctx.moveTo(r*.9,0);ctx.lineTo(r*1.5,0);ctx.moveTo(0,-r*1.5);ctx.lineTo(0,-r*.9);ctx.moveTo(0,r*.9);ctx.lineTo(0,r*1.5);ctx.stroke();ctx.restore()});
 if(flash>0){ctx.fillStyle='rgba(85,245,255,'+(flash*.12)+')';ctx.fillRect(0,0,w,h);flash=Math.max(0,flash-.06)}
}
function update(dt){if(!active)return;const speed=dt*.006,f=(keys.forward?1:0)-(keys.back?1:0),s=(keys.right?1:0)-(keys.left?1:0);px+=Math.sin(yaw)*f*speed+Math.cos(yaw)*s*speed;pz+=-Math.cos(yaw)*f*speed+Math.sin(yaw)*s*speed;px=Math.max(-7,Math.min(7,px));pz=Math.max(-2,Math.min(9,pz))}
function loop(t){let dt=Math.min(40,t-last||16);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function tagAt(x,y){if(!active)return;flash=1;let hit=null,best=Infinity;for(const t of targets){if(!t.alive||!t.screen)continue;let d=Math.hypot(x-t.screen.x,y-t.screen.y);if(d<t.screen.r&&d<best){best=d;hit=t}}if(hit){hit.alive=false;score+=100;scoreEl.textContent=String(score).padStart(4,'0');message.textContent='NICE TAG +100';message.style.color='#7affcf';if(targets.every(t=>!t.alive))setTimeout(()=>{if(active){spawn();message.textContent='TAP THE GLOWING DRONES';message.style.color='#effaff'}},800)}else{message.textContent='KEEP AIMING';message.style.color='#ff9fdf'}}
document.getElementById('play').addEventListener('click',()=>{active=true;start.style.display='none';spawn();message.textContent='TAP THE GLOWING DRONES'});
document.getElementById('tag').addEventListener('pointerdown',e=>{e.preventDefault();tagAt(w/2,h*.51)});
canvas.addEventListener('pointerdown',e=>{if(!active)return;canvas.setPointerCapture?.(e.pointerId);canvas.dataset.x=e.clientX;canvas.dataset.y=e.clientY;canvas.dataset.drag='0'});
canvas.addEventListener('pointermove',e=>{if(!active||!canvas.hasPointerCapture?.(e.pointerId))return;let dx=e.clientX-Number(canvas.dataset.x||e.clientX),dy=e.clientY-Number(canvas.dataset.y||e.clientY);if(Math.abs(dx)+Math.abs(dy)>3)canvas.dataset.drag='1';yaw+=dx*.004;pitch=Math.max(-130,Math.min(130,pitch+dy*.35));canvas.dataset.x=e.clientX;canvas.dataset.y=e.clientY});
canvas.addEventListener('pointerup',e=>{if(active&&canvas.dataset.drag!=='1')tagAt(e.clientX,e.clientY)});
document.querySelectorAll('[data-move]').forEach(btn=>{const k=btn.dataset.move,on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off)});
addEventListener('keydown',e=>{const map={ArrowUp:'forward',w:'forward',ArrowDown:'back',s:'back',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key])keys[map[e.key]]=true;if(e.key===' '){e.preventDefault();tagAt(w/2,h*.51)}});
addEventListener('keyup',e=>{const map={ArrowUp:'forward',w:'forward',ArrowDown:'back',s:'back',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key])keys[map[e.key]]=false});
})();
</script>
</body>
</html>
